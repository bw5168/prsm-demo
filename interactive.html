<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRSM V2 選址存活分析｜Shield Voice Technology</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Helvetica Neue',Arial,sans-serif;background:#f0f2f5;min-height:100vh}
  .header{background:linear-gradient(135deg,#1a1a2e,#16213e);color:white;padding:40px;text-align:center}
  .header h1{font-size:2em;margin-bottom:8px}
  .header p{color:#aaa;font-size:.95em}
  .version-badge{display:inline-block;background:#e74c3c;color:white;padding:3px 10px;border-radius:12px;font-size:.8em;margin-left:8px}
  .container{max-width:900px;margin:30px auto;padding:0 20px}
  .card{background:white;border-radius:12px;padding:30px;margin-bottom:24px;box-shadow:0 2px 12px rgba(0,0,0,.08)}
  .card h2{font-size:1.1em;color:#333;margin-bottom:20px;border-left:4px solid #2c3e50;padding-left:12px}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .form-group{display:flex;flex-direction:column}
  .form-group.full{grid-column:1/-1}
  label{font-size:.85em;color:#666;margin-bottom:6px;font-weight:500}
  input{padding:10px 14px;border:1px solid #ddd;border-radius:8px;font-size:1em;transition:border .2s}
  input:focus{outline:none;border-color:#2c3e50}
  .slider-wrap{display:flex;align-items:center;gap:12px}
  input[type=range]{flex:1;height:6px;accent-color:#2c3e50}
  .slider-val{font-weight:bold;color:#2c3e50;min-width:36px}
  .btn{width:100%;padding:14px;background:#2c3e50;color:white;border:none;border-radius:8px;font-size:1.1em;font-weight:bold;cursor:pointer;transition:background .2s;margin-top:8px}
  .btn:hover{background:#1a252f}
  .result{display:none}
  .score-box{text-align:center;padding:30px;border-radius:12px;margin-bottom:20px}
  .score-num{font-size:4em;font-weight:bold}
  .score-label{font-size:1.2em;margin-top:8px}
  .safe{background:#e8f5e9;color:#2e7d32}
  .warning{background:#fff8e1;color:#f57f17}
  .danger{background:#ffebee;color:#c62828}
  .detail-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:20px}
  .detail-item{background:#f8f9fa;border-radius:8px;padding:16px;text-align:center}
  .detail-item .val{font-size:1.4em;font-weight:bold;color:#2c3e50}
  .detail-item .lbl{font-size:.8em;color:#888;margin-top:4px}
  .stress-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:20px}
  .stress-item{border:2px solid #e0e0e0;border-radius:8px;padding:16px;text-align:center}
  .stress-item .val{font-size:1.3em;font-weight:bold;color:#e67e22}
  .stress-item .lbl{font-size:.78em;color:#888;margin-top:4px}
  .advice-box{padding:16px 20px;border-radius:8px;background:#f8f9fa;border-left:4px solid #2c3e50;color:#333;font-size:.95em}
  .history-table{width:100%;border-collapse:collapse;font-size:.88em}
  .history-table th{background:#2c3e50;color:white;padding:10px;text-align:left}
  .history-table td{padding:10px;border-bottom:1px solid #eee;vertical-align:top}
  .badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:.85em;font-weight:bold}
  .badge-safe{background:#e8f5e9;color:#2e7d32}
  .badge-warning{background:#fff8e1;color:#f57f17}
  .badge-danger{background:#ffebee;color:#c62828}
  .stress-label{font-size:.75em;color:#888;display:block}
  .powered{text-align:center;color:#bbb;font-size:.8em;padding:20px}
</style>
</head>
<body>
<div class="header">
  <h1>☕ PRSM 選址存活分析系統 <span class="version-badge">V2 Pro</span></h1>
  <p>Predictive Retail Survival Model｜含壓力測試與生存臨界分析</p>
</div>
<div class="container">
  <div class="card">
    <h2>📍 輸入候選地點資料</h2>
    <div class="form-grid">
      <div class="form-group full"><label>店點名稱</label><input type="text" id="name" placeholder="例：信義旗艦店"></div>
      <div class="form-group full"><label>地址</label><input type="text" id="address" placeholder="例：台北市信義區松高路12號"></div>
      <div class="form-group"><label>月租金 (NT$)</label><input type="number" id="rent" placeholder="例：120000"></div>
      <div class="form-group"><label>預估月營收 (NT$)</label><input type="number" id="revenue" placeholder="例：160000"></div>
      <div class="form-group full">
        <label>施工影響係數（1.0=無影響　0.8=營收衰退20%）</label>
        <div class="slider-wrap">
          <input type="range" id="impact" min="0.5" max="1.0" step="0.05" value="1.0" oninput="document.getElementById('impactVal').textContent=this.value">
          <span class="slider-val" id="impactVal">1.0</span>
        </div>
      </div>
    </div>
    <button class="btn" onclick="analyze()">🔍 立即分析</button>
  </div>

  <div class="card result" id="resultCard">
    <h2>📊 分析結果</h2>
    <div class="score-box" id="scoreBox">
      <div class="score-num" id="scoreNum"></div>
      <div class="score-label" id="scoreLabel"></div>
    </div>
    <div class="detail-grid">
      <div class="detail-item"><div class="val" id="d1"></div><div class="lbl">當前營租比 (OLR)</div></div>
      <div class="detail-item"><div class="val" id="d2"></div><div class="lbl">月租金</div></div>
      <div class="detail-item"><div class="val" id="d3"></div><div class="lbl">調整後月營收</div></div>
    </div>
    <h2 style="margin-bottom:16px">⚡ 壓力測試</h2>
    <div class="stress-grid">
      <div class="stress-item"><div class="val" id="s1"></div><div class="lbl">租金調漲10%後 OLR</div></div>
      <div class="stress-item"><div class="val" id="s2"></div><div class="lbl">生存臨界月營收</div></div>
      <div class="stress-item"><div class="val" id="s3"></div><div class="lbl">營收可下降空間</div></div>
    </div>
    <div class="advice-box" id="adviceBox"></div>
  </div>

  <div class="card" id="historyCard" style="display:none">
    <h2>📋 本次分析記錄</h2>
    <table class="history-table">
      <thead><tr><th>店點</th><th>OLR</th><th>租金+10%</th><th>臨界營收</th><th>可降空間</th><th>評級</th></tr></thead>
      <tbody id="historyBody"></tbody>
    </table>
  </div>
</div>
<div class="powered">Powered by PRSM-V2-Pro｜Shield Voice Technology</div>
<script>
const API="https://retail-survival-api-859868518848.asia-east1.run.app";
const history=[];
async function analyze(){
  const name=document.getElementById('name').value||'未命名';
  const address=document.getElementById('address').value||'';
  const rent=parseFloat(document.getElementById('rent').value);
  const revenue=parseFloat(document.getElementById('revenue').value);
  const impact=parseFloat(document.getElementById('impact').value);
  if(!rent||!revenue){alert('請輸入月租金與預估月營收');return;}
  const btn=document.querySelector('.btn');
  btn.textContent='分析中...';btn.disabled=true;
  try{
    const res=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({rent,revenue,construction_impact:impact})});
    const d=await res.json();
    const ar=d.analysis_result,st=d.stress_test;
    const cmap={Low:'safe',Medium:'warning',High:'danger'};
    const smap={Low:'✅ 安全（高勝率）',Medium:'⚠️ 警示（邊際存活）',High:'❌ 危險（高風險）'};
    document.getElementById('scoreBox').className='score-box '+cmap[ar.risk_level];
    document.getElementById('scoreNum').textContent=ar.current_olr;
    document.getElementById('scoreLabel').textContent=smap[ar.risk_level];
    document.getElementById('d1').textContent=ar.current_olr;
    document.getElementById('d2').textContent='NT$ '+rent.toLocaleString();
    document.getElementById('d3').textContent='NT$ '+Math.round(revenue*impact).toLocaleString();
    document.getElementById('s1').textContent=st.rent_up_10_percent_olr;
    document.getElementById('s2').textContent='NT$ '+st.survival_threshold_revenue.toLocaleString();
    document.getElementById('s3').textContent=st.revenue_drop_allowance;
    document.getElementById('adviceBox').textContent='💡 '+d.recommendation;
    document.getElementById('resultCard').style.display='block';
    history.push({name,address,rent,revenue,impact,ar,st,risk:ar.risk_level});
    renderHistory();
  }catch(e){alert('API 連線失敗，請稍後再試');}
  btn.textContent='🔍 立即分析';btn.disabled=false;
}
function renderHistory(){
  const cmap={Low:'safe',Medium:'warning',High:'danger'};
  const lmap={Low:'✅ 安全',Medium:'⚠️ 警示',High:'❌ 危險'};
  document.getElementById('historyBody').innerHTML=history.map(r=>`
    <tr>
      <td><strong>${r.name}</strong><br><span class="stress-label">${r.address}</span></td>
      <td>${r.ar.current_olr}</td>
      <td>${r.st.rent_up_10_percent_olr}</td>
      <td>NT$ ${r.st.survival_threshold_revenue.toLocaleString()}</td>
      <td>${r.st.revenue_drop_allowance}</td>
      <td><span class="badge badge-${cmap[r.risk]}">${lmap[r.risk]}</span></td>
    </tr>`).join('');
  document.getElementById('historyCard').style.display='block';
}
</script>
</body>
</html>
